<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login · Mabar</title>
    <link rel="preload" as="style" href="http://127.0.0.1:8000/build/assets/app-uFjQ20ed.css" /><link rel="modulepreload" as="script" href="http://127.0.0.1:8000/build/assets/app-DrykSKOY.js" /><link rel="stylesheet" href="http://127.0.0.1:8000/build/assets/app-uFjQ20ed.css" /><script type="module" src="http://127.0.0.1:8000/build/assets/app-DrykSKOY.js"></script><script id="browser-logger-active">
(function() {
    const ENDPOINT = 'http://127.0.0.1:8000/_boost/browser-logs';
    const logQueue = [];
    let flushTimeout = null;
    const captureTypes = ["error","warning","info","log","debug","table"];

    console.log('🔍 Browser logger active (MCP server detected). Posting to: ' + ENDPOINT);

    // Store original console methods
    const originalConsole = {
        log: console.log,
        debug: console.debug,
        info: console.info,
        error: console.error,
        warn: console.warn,
        table: console.table
    };

    // Walk own enumerable keys so JSON.stringify cannot auto-invoke a proxy fake toJSON (e.g. Livewire's `$wire`) and fire a real request.
    function toSafeValue(value, seen) {
        if (value === null || typeof value !== 'object') {
            return value;
        }
        if (value instanceof Error) {
            return { name: value.name, message: value.message, stack: value.stack };
        }
        // Date has no own enumerable keys, so the walk below would collapse it to {}.
        if (value instanceof Date) {
            return value.toISOString();
        }
        if (seen.has(value)) {
            return '[Circular]';
        }
        seen.add(value);
        if (Array.isArray(value)) {
            return value.map((item) => toSafeValue(item, seen));
        }
        const plain = {};
        for (const key of Object.keys(value)) {
            if (key === 'toJSON') continue;
            try {
                plain[key] = toSafeValue(value[key], seen);
            } catch (e) {
                plain[key] = '[Unreadable]';
            }
        }
        return plain;
    }

    // Helper to safely stringify values
    function safeStringify(obj) {
        return JSON.stringify(toSafeValue(obj, new WeakSet()));
    }

    // Normalize log type for consistency (e.g., 'warn' to 'warning')
    function normalizeType(type) {
        return type === 'warn' ? 'warning' : type;
    }

    // Determine if a log type should be captured based on configured levels
    function shouldCapture(type) {
        return captureTypes.includes(normalizeType(type));
    }

    // Batch and send logs
    function flushLogs() {
        if (logQueue.length === 0) return;

        const batch = logQueue.splice(0, logQueue.length);

        fetch(ENDPOINT, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({ logs: batch })
        }).catch(err => {
            // Silently fail to avoid infinite loops
            originalConsole.error('Failed to send logs:', err);
        });
    }

    // Debounced flush (100ms)
    function scheduleFlush() {
        if (flushTimeout) clearTimeout(flushTimeout);
        flushTimeout = setTimeout(flushLogs, 100);
    }

    // Intercept console methods
    ['log', 'debug', 'info', 'error', 'warn', 'table'].forEach(method => {
        console[method] = function(...args) {
            // Call original method
            originalConsole[method].apply(console, args);

            // Capture log data
            try {
                if (!shouldCapture(method)) {
                    return;
                }

                logQueue.push({
                    type: method,
                    timestamp: new Date().toISOString(),
                    data: args.map(arg => {
                        try {
                            return typeof arg === 'object' ? JSON.parse(safeStringify(arg)) : arg;
                        } catch (e) {
                            return String(arg);
                        }
                    }),
                    url: window.location.href,
                    userAgent: navigator.userAgent
                });

                scheduleFlush();
            } catch (e) {
                // Fail silently
            }
        };
    });

    // Global error handlers for uncaught errors
    const originalOnError = window.onerror;
    window.onerror = function boostErrorHandler(errorMsg, url, lineNumber, colNumber, error) {
        try {
            if (shouldCapture('error')) {
                logQueue.push({
                    type: 'uncaught_error',
                    timestamp: new Date().toISOString(),
                    data: [{
                        message: errorMsg,
                        filename: url,
                        lineno: lineNumber,
                        colno: colNumber,
                        error: error ? {
                            name: error.name,
                            message: error.message,
                            stack: error.stack
                        } : null
                    }],
                    url: window.location.href,
                    userAgent: navigator.userAgent
                });

                scheduleFlush();
            }

        } catch (e) {
            // Fail silently
        }

        // Call original handler if it exists
        if (originalOnError && typeof originalOnError === 'function') {
            return originalOnError(errorMsg, url, lineNumber, colNumber, error);
        }

        // Let the error continue to propagate
        return false;
    }
    window.addEventListener('error', (event) => {
        try {
            if (!shouldCapture('error')) {
                return false;
            }

            logQueue.push({
                type: 'window_error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: event.message,
                    filename: event.filename,
                    lineno: event.lineno,
                    colno: event.colno,
                    error: event.error ? {
                        name: event.error.name,
                        message: event.error.message,
                        stack: event.error.stack
                    } : null
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the error continue to propagate
        return false;
    });
    window.addEventListener('unhandledrejection', (event) => {
        try {
            if (!shouldCapture('error')) {
                return false;
            }

            logQueue.push({
                type: 'error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: 'Unhandled Promise Rejection',
                    reason: toSafeValue(event.reason, new WeakSet())
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the rejection continue to propagate
        return false;
    });

    // Flush on page unload
    window.addEventListener('beforeunload', () => {
        if (logQueue.length > 0) {
            navigator.sendBeacon(ENDPOINT, JSON.stringify({ logs: logQueue }));
        }
    });
})();
</script>
</head>
<body class="bg-[#f3f4f6] antialiased">
    <div class="flex min-h-screen items-center justify-center px-4 py-12">
        <div class="w-full max-w-[520px] rounded-[22px] border border-slate-200 bg-white p-7 shadow-[0_10px_30px_rgba(15,23,42,0.06)] sm:p-8">
            <div class="mb-7 text-center">
                <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-xl bg-blue-600 text-3xl font-bold text-white">M</div>
                <h1 class="text-4xl font-semibold tracking-[-0.04em] text-slate-900">Masuk ke Mabar</h1>
                <p class="mt-3 text-base text-slate-500">Gunakan akun Anda untuk masuk ke dashboard.</p>
            </div>

            <form method="POST" action="http://127.0.0.1:8000/login" class="space-y-5">
                <input type="hidden" name="_token" value="Aa0GqyYcok6ze6BR2xxRAi9jjoxDXIkIFAkEWKyG" autocomplete="off">
                <div>
                    <label for="email" class="mb-2 block text-[17px] font-medium text-slate-700">Email</label>
                    <input
                        id="email"

                    >
                                    </div>

                <div>
                    <label for="password" class="mb-2 block text-[17px] font-medium text-slate-700">Password</label>
                    <input
                        id="password"

                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-base text-slate-800 shadow-sm outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
                    >
                </div>

                <div class="flex items-center justify-between gap-3 pt-1 text-sm text-slate-600">
                    <label class="inline-flex items-center gap-3">
                        <input type="checkbox" name="remember" value="1" class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        <span>Ingat saya</span>
                    </label>
                    <a href="#" class="font-medium text-blue-600 hover:text-blue-700">Lupa password?</a>
                </div>

                <button type="submit" class="w-full rounded-xl bg-blue-600 px-4 py-3 text-lg font-semibold text-white shadow-[0_8px_18px_rgba(37,99,235,0.25)] transition hover:bg-blue-700">Masuk</button>
            </form>

            <div class="mt-6 rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
                <p class="font-medium text-slate-700">Akun contoh:</p>
                <div class="mt-2">Superadmin: superadmin@example.com / password</div>
                <div class="mt-1">Marketing: marketing@example.com / password</div>
            </div>
        </div>
    </div>
</body>
